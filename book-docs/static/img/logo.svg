<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes roboglow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(124, 58, 237, 0.5)); }
        50% { filter: drop-shadow(0 0 12px rgba(124, 58, 237, 0.8)); }
      }
      .robo-glow {
        animation: roboglow 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Outer glowing ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#purpleGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Define gradient -->
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main robot body - Head -->
  <rect x="70" y="40" width="60" height="55" rx="8" fill="#7c3aed" class="robo-glow"/>

  <!-- Head accent border -->
  <rect x="70" y="40" width="60" height="55" rx="8" fill="none" stroke="#a78bfa" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="85" cy="60" r="6" fill="#ffffff"/>
  <circle cx="115" cy="60" r="6" fill="#ffffff"/>
  <circle cx="85" cy="60" r="3" fill="#000000"/>
  <circle cx="115" cy="60" r="3" fill="#000000"/>

  <!-- LED indicator -->
  <circle cx="100" cy="85" r="3" fill="#00ff00" opacity="0.8"/>
  <circle cx="100" cy="85" r="3" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.4"/>

  <!-- Main body -->
  <rect x="60" y="100" width="80" height="50" rx="6" fill="#8b5cf6"/>
  <rect x="60" y="100" width="80" height="50" rx="6" fill="none" stroke="#a78bfa" stroke-width="2"/>

  <!-- Central circuit line -->
  <line x1="100" y1="100" x2="100" y2="150" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>

  <!-- Left arm -->
  <rect x="35" y="110" width="25" height="12" rx="6" fill="#7c3aed"/>
  <circle cx="37" cy="116" r="4" fill="#a78bfa"/>

  <!-- Right arm -->
  <rect x="140" y="110" width="25" height="12" rx="6" fill="#7c3aed"/>
  <circle cx="163" cy="116" r="4" fill="#a78bfa"/>

  <!-- Left leg -->
  <rect x="70" y="150" width="10" height="35" rx="5" fill="#6d28d9"/>
  <rect x="68" y="150" width="14" height="35" rx="5" fill="none" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- Right leg -->
  <rect x="120" y="150" width="10" height="35" rx="5" fill="#6d28d9"/>
  <rect x="118" y="150" width="14" height="35" rx="5" fill="none" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- Feet -->
  <ellipse cx="75" cy="189" rx="6" ry="4" fill="#7c3aed"/>
  <ellipse cx="125" cy="189" rx="6" ry="4" fill="#7c3aed"/>

  <!-- Panel details -->
  <rect x="70" y="115" width="12" height="12" fill="none" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="118" y="115" width="12" height="12" fill="none" stroke="#ddd6fe" stroke-width="1"/>

  <!-- Tech accent lines -->
  <line x1="85" y1="130" x2="95" y2="130" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
  <line x1="105" y1="130" x2="115" y2="130" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
</svg>
